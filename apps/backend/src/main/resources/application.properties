spring.application.name=clai

# Importa variaveis do .env (funciona com as do shell tambem).
# O primeiro caminho vale se rodar a partir da raiz, o segundo a partir de apps/backend.
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]

# Nao deixa o Spring subir/derrubar o compose sozinho (o compose agora tem a API tambem)
spring.docker.compose.lifecycle-management=none

# Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clai_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Otimizacao do Pool de Conexoes
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Segurar a conexao com o banco (nao necessario para nosso caso agora)
# spring.jpa.open-in-view=false

# Otimizacao de busca em lote
spring.jpa.properties.hibernate.default_batch_fetch_size=100